name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / Ubuntu
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Validate repository documents and metadata
        run: python scripts/check_docs.py
      - name: Lint
        run: ruff check src tests scripts
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run tests with coverage
        run: pytest --cov=diffractscout --cov-report=term-missing --cov-report=xml --cov-fail-under=65
      - name: Run and verify offline scientific demo
        run: |
          python -m diffractscout demo -o ci_demo
          python -m diffractscout verify ci_demo
      - name: Run analytic scientific benchmarks
        run: python -m diffractscout benchmark -o ci_benchmark
      - name: Generate JOSS readiness snapshot
        if: matrix.python-version == '3.13'
        run: python scripts/joss_readiness.py --output ci_joss_readiness
      - name: Upload JOSS readiness snapshot
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: joss-readiness
          path: ci_joss_readiness
          if-no-files-found: error
      - name: Upload coverage report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
      - name: Upload analytic benchmark evidence
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: analytic-benchmark
          path: ci_benchmark
          if-no-files-found: error

  mp-compatibility:
    name: Materials Project extras / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Materials Project extra and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mp,test]"
      - name: Import provider client and run offline helper regressions
        run: |
          python -c "import mp_api, pymatgen; from diffractscout.providers.materials_project import _matrix; assert _matrix([[1 if i == j else 0 for j in range(6)] for i in range(6)]) is not None"
          pytest -q tests/test_provider_helpers.py

  cross-platform-smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Parse PowerShell publication helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: '[void][scriptblock]::Create((Get-Content scripts/publish_github.ps1 -Raw))'
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run tests
        run: pytest -q
      - name: Run and verify offline demo
        run: |
          python -m diffractscout demo -o ci_demo
          python -m diffractscout verify ci_demo
      - name: Run analytic benchmark
        run: python -m diffractscout benchmark -o ci_benchmark


  gui-smoke:
    name: GUI smoke / Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Xvfb and package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Construct and close the Tk interface
        run: |
          xvfb-run -a python -c "from diffractscout.gui import create_app; app=create_app(); app.update(); app.destroy()"
      - name: Run GUI interaction tests
        run: xvfb-run -a pytest -q tests/test_gui.py

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install wheel in a clean virtual environment
        run: |
          python -m venv wheel-test
          wheel-test/bin/python -m pip install dist/*.whl
          wheel-test/bin/python -m pip check
          wheel-test/bin/diffractscout --version
          wheel-test/bin/diffractscout demo -o wheel_demo
          wheel-test/bin/diffractscout verify wheel_demo
          wheel-test/bin/diffractscout benchmark -o wheel_benchmark
          wheel_cif=$(wheel-test/bin/python -c "import pathlib,diffractscout; print(pathlib.Path(diffractscout.__file__).with_name('benchmark_data')/'fcc_al.cif')")
          test -f "$wheel_cif"
          wheel-test/bin/diffractscout-quick-export "$wheel_cif" -o wheel_quick.xlsx
          wheel-test/bin/diffractscout verify wheel_quick_bundle
          test -x wheel-test/bin/diffractscout-gui
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
