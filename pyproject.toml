[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffractscout"
version = "0.3.0"
description = "Provenance-first phase scouting, CIF validation, theoretical powder diffraction, and hkl-resolved elasticity."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Delun Gong", email = "dlgong17s@imr.ac.cn"},
]
keywords = [
  "materials science",
  "powder diffraction",
  "crystallography",
  "phase screening",
  "Materials Project",
  "elasticity",
  "XRD",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "gemmi>=0.7.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "spglib>=2.4",
]

[project.optional-dependencies]
mp = [
  "mp-api>=0.43",
  "pymatgen>=2024.11.13",
]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]
# Optional display figures and JOSS paper figure regeneration.
figures = [
  "matplotlib>=3.7",
]
# Alias kept for existing paper/build docs.
paper = [
  "matplotlib>=3.7",
]
# Optional Tk drag-and-drop helpers for future desktop UX (not required by core GUI).
"gui-dnd" = [
  "tkinterdnd2>=0.3.0",
]

[project.scripts]
diffractscout = "diffractscout.cli:main"
diffractscout-quick-export = "diffractscout.quick_export:main"

[project.gui-scripts]
diffractscout-gui = "diffractscout.gui:main"

[project.urls]
Homepage = "https://github.com/D-sudoasd/DiffractScout"
Repository = "https://github.com/D-sudoasd/DiffractScout"
Issues = "https://github.com/D-sudoasd/DiffractScout/issues"
Documentation = "https://github.com/D-sudoasd/DiffractScout/tree/main/docs"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diffractscout = ["benchmark_data/*.cif", "benchmark_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

# The crystallographic h, k, l convention is part of the public result schema
# and of the directional-elasticity equations in these domain modules.
[tool.ruff.lint.per-file-ignores]
"src/diffractscout/elasticity.py" = ["E741"]
"src/diffractscout/models.py" = ["E741"]

[tool.coverage.run]
omit = [
  "src/diffractscout/gui.py",
  "src/diffractscout/__main__.py",
]

[tool.coverage.report]
show_missing = true
